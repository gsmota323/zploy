services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zploy-api
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcc_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zploy-worker
    command: npm run worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tcc_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      # Lê o heartbeat em arquivo gravado pelo próprio worker (dist/ já existe na imagem, mesmo rodando via ts-node-dev).
      test: ["CMD", "node", "dist/utils/workerHealthCheckCli.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
