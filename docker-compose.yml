services:
  postgres: #banco
    image: postgres:15
    container_name: postgres-tcc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc_db
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcc_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  
  redis: # fila
    image: redis:alpine
    container_name: redis-tcc
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12