<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Zploy</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .page-layout {
      display: block;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 28px;
      background: rgba(7, 7, 8, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .topbar-left .logo-icon {
      width: 28px;
      height: 28px;
      font-size: 0.9rem;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }

    .topbar-link:hover, .topbar-link.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* ===== MAIN ===== */
    .main {
      overflow-y: auto;
    }

    .page-header {
      padding: 28px 28px 0;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .page-content {
      padding: 0 28px 48px;
    }

    /* ===== APPS GRID ===== */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .app-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    .app-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .app-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: white;
    }

    .app-card-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-card-url {
      font-size: 0.78rem;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-card-url:empty::after {
      content: 'Sem deploy ainda';
      color: var(--text-muted);
    }

    .app-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .add-app-card {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      min-height: 160px;
      transition: all var(--transition);
      color: var(--text-muted);
    }

    .add-app-card:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(124,92,252,0.04);
    }

    .add-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px dashed currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* ===== MODAL DE CRIAR APP ===== */
    .modal-form { display: flex; flex-direction: column; gap: 20px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="page-layout">
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-icon">D</span>
        Dashboard
      </div>
      <nav class="topbar-nav">
        <a class="topbar-link active" href="dashboard.html">Dashboard</a>
        <button class="btn btn-ghost btn-sm" onclick="Auth.logout()">Sair</button>
      </nav>
    </header>

    <!-- MAIN -->
    <main class="main">
      <div class="page-header">
        <div class="flex justify-between items-start flex-wrap gap-16">
          <div>
            <h1 class="page-title fade-in-up">Meus Apps</h1>
            <p class="page-subtitle fade-in-up fade-in-up-delay-1">Gerencie suas aplicações e deploys.</p>
          </div>
          <button class="btn btn-primary fade-in-up fade-in-up-delay-2" onclick="openModal()">
            + Novo App
          </button>
        </div>
      </div>

      <div class="page-content">
        <div class="apps-grid" id="apps-grid">
          <!-- skeleton enquanto carrega -->
          <div class="skeleton" style="height:160px;border-radius:var(--radius)"></div>
          <div class="skeleton" style="height:160px;border-radius:var(--radius)"></div>
          <div class="skeleton" style="height:160px;border-radius:var(--radius)"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL CRIAR APP -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <h2 class="modal-title">Novo App</h2>
      <p class="modal-subtitle">Dê um nome único para a sua aplicação. Você poderá configurar o deploy na próxima tela.</p>
      <div class="modal-form">
        <div class="field">
          <label class="label" for="app-name">Nome do App</label>
          <input class="input" type="text" id="app-name" placeholder="ex: minha-api-node" autofocus>
          <span style="font-size:0.78rem;color:var(--text-muted)">Use apenas letras minúsculas, números e hífens.</span>
        </div>
        <div id="create-error" class="error-msg"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" id="btn-create" onclick="createApp()">Criar App</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .error-msg {
      background: var(--danger-surface);
      border: 1px solid rgba(255,74,110,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.88rem;
      color: var(--danger);
      display: none;
    }
    .error-msg.visible { display: block; }
    .loading {
      display: inline-block; width:14px; height:14px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="js/api.js"></script>
  <script>
    async function bootstrap() {
      const allowed = await requireAuth();
      if (!allowed) return;
      loadApps();
    }

    async function loadApps() {
      const grid = document.getElementById('apps-grid');
      const { ok, data } = await Apps.list();
      const debugMode = new URLSearchParams(window.location.search).get('debug') === '1';

      const apps = Array.isArray(data) ? data : [];

      if (!ok && apps.length === 0) {
        const details = data?.error ? escHtml(data.error) : '';
        const subtitle = details
          ? 'Nao foi possivel carregar seus apps agora.'
          : 'Voce ainda nao criou nenhum app.';
        grid.innerHTML = `
          <div class="empty-state">
            <p class="empty-title">Nenhum app para exibir agora</p>
            <p style="color:var(--text-muted);font-size:0.9rem;margin-top:6px;">${subtitle}</p>
            ${(debugMode && details) ? `<p style="color:var(--text-muted);font-size:0.82rem;margin-top:6px;">Detalhe: ${details}</p>` : ''}
            <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
              <button class="btn btn-secondary" onclick="loadApps()">Tentar novamente</button>
              <button class="btn btn-primary" onclick="openModal()">Criar App</button>
            </div>
          </div>`;
        return;
      }

      let html = '';

      if (apps.length === 0) {
        html = `
          <div class="add-app-card" onclick="openModal()">
            <div class="add-icon">+</div>
            <div style="font-weight:600;font-size:0.95rem;">Nenhum app criado</div>
            <div style="font-size:0.85rem;">Clique para criar seu primeiro app</div>
          </div>`;
      } else {
        html = apps.map(app => {
          const initials = app.name.slice(0,2).toUpperCase();
          return `
            <a href="app.html?id=${app.id}" class="app-card fade-in-up">
              <div class="app-card-top">
                <div class="flex items-center gap-12">
                  <div class="app-icon">${initials}</div>
                  <div>
                    <div class="app-card-name">${escHtml(app.name)}</div>
                    <div class="app-card-url">${escHtml(app.url || '')}</div>
                  </div>
                </div>
                ${statusBadge(app.status)}
              </div>
              <div class="app-card-footer">
                <span>Criado em ${formatDate(app.createdAt)}</span>
                <span style="color:var(--primary);font-weight:600;">Ver →</span>
              </div>
            </a>`;
        }).join('') + `
          <div class="add-app-card" onclick="openModal()">
            <div class="add-icon">+</div>
            <div style="font-weight:600;font-size:0.95rem;">Novo App</div>
          </div>`;
      }

      grid.innerHTML = html;
    }

    function escHtml(v) {
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function openModal() {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('app-name').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('create-error').classList.remove('visible');
      document.getElementById('app-name').value = '';
    }

    function closeModalOnOverlay(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    async function createApp() {
      const name = document.getElementById('app-name').value.trim();
      const btn = document.getElementById('btn-create');
      const errEl = document.getElementById('create-error');

      if (!name) {
        errEl.textContent = 'Informe o nome do App.';
        errEl.classList.add('visible');
        return;
      }

      btn.innerHTML = '<span class="loading"></span> Criando...';
      btn.disabled = true;
      errEl.classList.remove('visible');

      const { ok, data } = await Apps.create(name);

      if (ok && data.id) {
        closeModal();
        window.location.href = `app.html?id=${data.id}`;
      } else {
        errEl.textContent = data?.error || 'Erro ao criar app.';
        errEl.classList.add('visible');
        btn.innerHTML = 'Criar App';
        btn.disabled = false;
      }
    }

    document.getElementById('app-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') createApp();
    });

    bootstrap();
  </script>
</body>
</html>
