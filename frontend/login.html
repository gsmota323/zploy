<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Zploy</title>
  <meta name="description" content="Faça login ou crie sua conta no Zploy para começar a fazer deploys automatizados.">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, rgba(124,92,252,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(0,212,255,0.10) 0%, transparent 50%),
        var(--bg);
    }

    .auth-wrapper {
      width: min(440px, calc(100% - 32px));
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .auth-logo .logo-icon {
      width: 38px;
      height: 38px;
      font-size: 1.2rem;
    }

    .auth-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      backdrop-filter: blur(30px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 32px;
    }

    .auth-tab {
      padding: 9px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition);
      user-select: none;
    }

    .auth-tab.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.92rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form { display: flex; flex-direction: column; gap: 16px; }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .input.with-icon { padding-left: 40px; }

    .btn-submit {
      width: 100%;
      margin-top: 4px;
      padding: 13px;
      font-size: 1rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .error-msg {
      background: var(--danger-surface);
      border: 1px solid rgba(255,74,110,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.88rem;
      color: var(--danger);
      display: none;
    }

    .error-msg.visible { display: block; }

    .success-msg {
      background: var(--success-surface);
      border: 1px solid rgba(0,233,106,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.88rem;
      color: var(--success);
      display: none;
    }

    .success-msg.visible { display: block; }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-wrapper fade-in-up">

    <div class="auth-logo">
      <a href="index.html">
        <span class="logo-icon">⚡</span>
        Zploy
      </a>
    </div>

    <div class="auth-box">

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Criar conta</div>
      </div>

      <!-- LOGIN -->
      <div id="view-login">
        <h1 class="auth-title">Bem-vindo de volta 👋</h1>
        <p class="auth-subtitle">Faça login para acessar seus deploys e apps.</p>

        <div id="login-error" class="error-msg"></div>

        <div class="form">
          <div class="field">
            <label class="label" for="login-email">E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input class="input with-icon" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label class="label" for="login-password">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input class="input with-icon" type="password" id="login-password" placeholder="Sua senha" autocomplete="current-password">
            </div>
          </div>

          <button class="btn btn-primary btn-submit" id="btn-login" onclick="doLogin()">
            Entrar na plataforma
          </button>
        </div>
      </div>

      <!-- REGISTER -->
      <div id="view-register" style="display:none">
        <h1 class="auth-title">Crie sua conta 🚀</h1>
        <p class="auth-subtitle">Grátis e sem cartão de crédito. Comece a fazer deploys agora.</p>

        <div id="register-error" class="error-msg"></div>
        <div id="register-success" class="success-msg"></div>

        <div class="form">
          <div class="field">
            <label class="label" for="reg-email">E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input class="input with-icon" type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label class="label" for="reg-password">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input class="input with-icon" type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>
          </div>

          <button class="btn btn-primary btn-submit" id="btn-register" onclick="doRegister()">
            Criar minha conta
          </button>
        </div>
      </div>

      <div class="auth-footer" id="auth-footer">
        Não tem conta? <a href="#" onclick="switchTab('register'); return false;">Criar agora</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Se já logado, redireciona
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    // Checa URL para tab inicial
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') switchTab('register');

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('view-login').style.display = isLogin ? '' : 'none';
      document.getElementById('view-register').style.display = isLogin ? 'none' : '';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('auth-footer').innerHTML = isLogin
        ? `Não tem conta? <a href="#" onclick="switchTab('register'); return false;">Criar agora</a>`
        : `Já tem conta? <a href="#" onclick="switchTab('login'); return false;">Entrar</a>`;
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');

      if (!email || !password) {
        showError(errEl, 'Preencha e-mail e senha.');
        return;
      }

      btn.innerHTML = '<span class="loading"></span> Entrando...';
      btn.disabled = true;
      errEl.classList.remove('visible');

      const { ok, data } = await Auth.login(email, password);

      if (ok) {
        window.location.href = 'dashboard.html';
      } else {
        showError(errEl, data?.error || 'E-mail ou senha inválidos.');
        btn.innerHTML = 'Entrar na plataforma';
        btn.disabled = false;
      }
    }

    async function doRegister() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register');
      const errEl = document.getElementById('register-error');
      const succEl = document.getElementById('register-success');

      if (!email || !password) {
        showError(errEl, 'Preencha e-mail e senha.');
        return;
      }

      btn.innerHTML = '<span class="loading"></span> Criando conta...';
      btn.disabled = true;
      errEl.classList.remove('visible');
      succEl.classList.remove('visible');

      const { ok, data } = await Auth.register(email, password);

      if (ok) {
        succEl.textContent = '✔ Conta criada! Fazendo login...';
        succEl.classList.add('visible');
        const login = await Auth.login(email, password);
        if (login.ok) {
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        }
      } else {
        showError(errEl, data?.error || 'Erro ao criar conta. Tente novamente.');
        btn.innerHTML = 'Criar minha conta';
        btn.disabled = false;
      }
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('visible');
    }

    // Enter key
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginVisible = document.getElementById('view-login').style.display !== 'none';
      if (loginVisible) doLogin(); else doRegister();
    });
  </script>
</body>
</html>
